# Trading Bot Configuration

# API Configuration
api:
  # API credentials are loaded from .env file
  timeout: 30
  max_retries: 3

# Trading Parameters
trading:
  # Supported: ONE_MINUTE, FIVE_MINUTE, FIFTEEN_MINUTE, THIRTY_MINUTE, ONE_HOUR, TWO_HOUR, SIX_HOUR, ONE_DAY
  candle_granularity: "ONE_HOUR"  # Changed from FIFTEEN_MINUTE to reduce noise and false signals
  candle_periods_for_analysis: 200  # Increased from 100 for more reliable indicators
  loop_sleep_seconds: 300  # 5 minutes - increased from 60s to match hourly timeframe
  max_products_to_analyze: 20
  max_ws_subscriptions: 100
  
  # Full market scan interval (every N cycles)
  # Set to 1 to scan every cycle, 10 to scan every 10th cycle, etc.
  full_scan_interval_cycles: 1
  
  # Parallel processing for faster scanning
  # WARNING: Too many workers will trigger API rate limits (HTTP 429)
  max_scan_workers: 3  # Max concurrent threads for market scanning (1-5 recommended)
  max_holdings_workers: 2  # Max concurrent threads for holdings analysis (1-3 recommended)
  
  # Minimum signal confidence to execute trades (0.0 to 1.0)
  min_signal_confidence: 0.60  # 60% confidence threshold - increased from 50% to reduce false signals
  
  # IMPORTANT: Set to false for live trading
  paper_trading_mode: true

# Risk Management
risk_management:
  # Maximum percentage of total portfolio to risk on a single trade
  risk_percent_per_trade: 0.05  # 5% (increased for small accounts)
  
  # Maximum percentage of portfolio to allocate to any single position
  max_position_size_percent: 0.20  # 20% (increased for small accounts)
  
  # Maximum total exposure (sum of all positions as % of portfolio)
  max_total_exposure_percent: 0.80  # 80% (increased to allow more positions)
  
  # Minimum USD value per trade (keep at $10 to ensure positions are large enough to monitor)
  min_usd_trade_value: 10.0  # $10
  
  # Default stop loss percentage below entry
  default_stop_loss_percent: 0.015  # 1.5%
  
  # Default take profit percentage above entry
  default_take_profit_percent: 0.03  # 3%
  
  # Trailing stop loss (if enabled, will move stop up as price increases)
  use_trailing_stop: false
  trailing_stop_percent: 0.02  # 2%
  
  # Maximum allowed drawdown before stopping trading
  max_drawdown_percent: 0.15  # 15%
  
  # Maximum number of concurrent positions
  max_concurrent_positions: 5
  
  # Maximum fee percentage allowed per trade (as % of position value)
  max_fee_percent: 0.02  # 2% (allows for taker fees ~0.6%)
  
  # Maximum slippage percentage allowed per trade
  max_slippage_percent: 0.01  # 1%
  
  # Order fill timeout (seconds to wait for limit order to fill before cancelling)
  order_fill_timeout: 300  # 300 seconds (5 minutes) - increased from 60s to reduce cancellation rate

# AI Analysis Configuration
ai_analysis:
  enabled: true
  analysis_interval_minutes: 60  # How often to ask AI for strategy recommendation
  min_data_points: 50  # Minimum data points before AI analysis
  min_confidence: 0.7  # Minimum confidence to switch strategies based on AI
  model: "x-ai/grok-4.1-fast"  # OpenRouter model

# Strategy Selection and Parameters
strategies:
  # Active strategy: momentum, mean_reversion, breakout, hybrid, or custom
  active_strategy: "mean_reversion"
  
  # Momentum Strategy Parameters
  momentum:
    rsi_period: 14
    rsi_oversold: 30
    rsi_overbought: 70
    macd_fast: 12
    macd_slow: 26
    macd_signal: 9
    bb_period: 20
    bb_std: 2.0
    volume_threshold: 1.5  # Volume must be 1.5x average
    adx_length: 14
    ema_fast_length: 20
    ema_slow_length: 50
    volume_ma_length: 20
    adx_threshold: 15
    volume_confirmation_multiplier: 2.5
    price_proximity_threshold: 0.015
    rsi_momentum_buy_lower_bound: 60  # Increased from 50 to reduce false breakouts
    rsi_momentum_buy_upper_bound: 75
    rsi_momentum_sell_upper_bound: 40
  
  # Mean Reversion Strategy Parameters
  mean_reversion:
    bb_period: 20
    bb_std: 2.0
    rsi_period: 14
    rsi_extreme_oversold: 25  # Increased from 20 to reduce whipsaw trades
    rsi_extreme_overbought: 80
    mean_lookback: 50
    stoch_length: 14
    ema_long_length: 200
    distance_from_mean_threshold: -5
  
  # Breakout Strategy Parameters
  breakout:
    lookback_period: 50
    volume_confirmation: true
    volume_threshold: 3.0
    atr_period: 14
    atr_multiplier: 1.5
    adx_length: 14
    bb_period: 20
    bb_std: 2.0
    volume_ma_short_length: 3
    adx_consolidation_threshold: 20
    adx_trending_threshold: 25
    bb_squeeze_threshold: 4.0
    volume_dry_up_threshold: 0.8
    atr_expansion_multiplier: 1.5
    close_strength_threshold: 0.75

  
  # Hybrid Strategy (combines multiple signals)
  hybrid:
    use_momentum: true
    use_mean_reversion: true
    use_breakout: false
    min_signals_required: 2  # Require at least 2 strategies to agree

# Performance & Analytics
analytics:
  # Track performance metrics
  calculate_sharpe_ratio: true
  calculate_sortino_ratio: true
  risk_free_rate: 0.04  # 4% annual risk-free rate
  
  # Save equity curve data
  save_equity_curve: true
  equity_curve_interval: 3600  # seconds (1 hour)
  
  # Generate reports
  daily_report: true
  weekly_report: true

# Monitoring & Alerts
monitoring:
  # Health check interval (seconds)
  health_check_interval: 300  # 5 minutes
  
  # Alert configuration
  alerts:
    enabled: false
    email:
      enabled: false
      smtp_server: "smtp.gmail.com"
      smtp_port: 587
      from_address: ""
      to_addresses: []
      password_env_var: "EMAIL_PASSWORD"
    
    # Alert triggers
    alert_on_trade: false
    alert_on_error: true
    alert_on_large_loss: true
    large_loss_threshold: 0.05  # 5%
    alert_on_connection_loss: true

# Database Configuration
database:
  type: "sqlite"
  path: "data/trading_bot.db"
  backup_enabled: true
  backup_interval: 86400  # seconds (24 hours)

# Market Regime Detection Configuration
regime_detection:
  # Reference product for regime analysis (typically BTC-USD for crypto markets)
  regime_reference_product: "BTC-USD"
  
  # Timeframe for regime analysis (higher timeframe = more stable regime detection)
  # Supported: FIVE_MINUTE, FIFTEEN_MINUTE, THIRTY_MINUTE, ONE_HOUR, TWO_HOUR, SIX_HOUR, ONE_DAY
  regime_timeframe: "ONE_HOUR"
  
  # ADX thresholds for regime classification
  adx_trending_threshold: 25    # ADX > 25 = Trending market (use Momentum)
  adx_ranging_threshold: 20     # ADX < 20 = Ranging market (use Mean Reversion)
  adx_period: 14                # Period for ADX calculation
  
  # Additional indicators for regime confirmation
  volatility_lookback: 20       # Lookback period for volatility calculation
  volatility_threshold: 2.0     # Threshold for high volatility detection
  
  # EMAs for trend direction (used in regime analysis)
  regime_ema_fast: 20
  regime_ema_slow: 50
  
  # Cache duration to avoid excessive recalculation
  regime_cache_duration_seconds: 300  # 5 minutes (re-check regime every 5 min)

# Backtesting Configuration
backtesting:
  enabled: false
  start_date: "2024-01-01"
  end_date: "2024-12-31"
  initial_capital: 10000.0
  data_source: "coinbase"  # or "csv"
  csv_path: "data/historical/"

# Logging Configuration
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  log_to_file: true
  log_to_console: true
  log_directory: "logs"
  max_log_size_mb: 100
  backup_count: 10
  
  # API Response Logging (for debugging)
  log_api_responses: true  # Log raw API responses to separate file
  api_log_file: "logs/api_responses.log"  # Separate file for API calls
  log_api_errors_only: false  # If true, only log failed API calls

